events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    server {
        listen 80;
        server_name localhost;

        # Hashed build artifacts (main-*.js, chunk-*.js, styles-*.css) are
        # content-addressed by Angular's build, so it's always safe to cache
        # them for a long time — a new deploy ships new filenames.
        location ~* \.(?:js|css)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(?:woff2?|ttf|svg|png|jpg|jpeg|ico)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html must always be revalidated so a new deploy's asset
        # hashes are picked up on next load instead of being served stale.
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # Frontend assets and routing
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend Proxy routing
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
        }
    }
}
